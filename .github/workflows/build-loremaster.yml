name: Build SpinUI Windows package

on:
  push:
    branches: ["main", "agent/**", "claude/**", "codex/**"]
    paths:
      - "spinui_reloaded/**"
      - "layouts/**"
      - "loremaster/**"
      - "installer/**"
      - "tools/**"
      - "docs/**"
      - "UI_Spin_qeynos_LO1.ini"
      - "README.md"
      - ".github/workflows/build-loremaster.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish these builds on the GitHub Releases page"
        required: true
        default: true
        type: boolean
      release_tag:
        description: "Release tag to create or update"
        required: true
        default: "v1.0.0"
        type: string
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The layout drift check rebuilds from the immutable stock-layout
          # commit used by generate_spinui_layout.py.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check pyinstaller pillow

      - name: Run release quality gate
        run: python tools/release_quality_gate.py

      - name: Build Loremaster executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/spec | Out-Null
          # --version-file is resolved relative to --specpath, so pass
          # absolute paths.
          pyinstaller --clean --noconfirm --onefile --windowed `
            --name Loremaster --distpath dist --workpath build/loremaster `
            --add-data "$((Resolve-Path 'loremaster/assets').Path);assets" `
            --version-file (Join-Path $PWD 'loremaster/versioninfo-loremaster.txt') `
            --specpath build/spec loremaster/loremaster.py

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $lore = Start-Process -FilePath dist/Loremaster.exe -ArgumentList '--selftest' -PassThru -Wait
          if ($lore.ExitCode -ne 0) { throw "Loremaster selftest exit code $($lore.ExitCode)" }

      - name: Assemble staged manual release
        shell: pwsh
        run: |
          $manualPackage = Join-Path $PWD 'package/SpinUI-Manual'
          New-Item -ItemType Directory -Force -Path $manualPackage | Out-Null
          Copy-Item -Recurse -Force spinui_reloaded (Join-Path $manualPackage 'spinui_reloaded')
          # Public aliases plus every validated resolution profile ship;
          # layouts/original and layouts/spin-live stay internal.
          $packageLayouts = Join-Path $manualPackage 'layouts'
          New-Item -ItemType Directory -Force -Path $packageLayouts | Out-Null
          foreach ($preset in @('combat-focus', 'social-focus', 'hybrid')) {
            Copy-Item -Recurse -Force (Join-Path 'layouts' $preset) (Join-Path $packageLayouts $preset)
          }
          Copy-Item -Recurse -Force layouts/profiles (Join-Path $packageLayouts 'profiles')
          Copy-Item -Recurse -Force docs (Join-Path $manualPackage 'docs')
          Copy-Item -Force UI_Spin_qeynos_LO1.ini $manualPackage
          Copy-Item -Force README.md $manualPackage
          Copy-Item -Force installer/INSTALL-MANUAL.md (Join-Path $manualPackage 'INSTALL.md')
          Copy-Item -Force dist/Loremaster.exe $manualPackage

      - name: Verify staged release packages
        run: >
          python tools/release_quality_gate.py --packages-only
          --package manual=package/SpinUI-Manual

      - name: Compress verified release packages
        shell: pwsh
        run: |
          $manualPackage = Join-Path $PWD 'package/SpinUI-Manual'
          Compress-Archive -Path "$manualPackage/*" -DestinationPath package/SpinUI-Manual.zip -CompressionLevel Optimal

      - name: Publish SHA-256 checksums
        shell: pwsh
        run: |
          # A published checksum list lets users confirm a download is the
          # exact CI-built file when an antivirus heuristic questions it.
          $lines = foreach ($file in @(
              'package/SpinUI-Manual.zip',
              'dist/Loremaster.exe')) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $file)"
          }
          Set-Content -Path package/SHA256SUMS.txt -Value ($lines -join "`n") -NoNewline
          Add-Content -Path package/SHA256SUMS.txt -Value "`n"
          Get-Content package/SHA256SUMS.txt

      - name: Upload manual package
        uses: actions/upload-artifact@v4
        with:
          name: SpinUI-Manual
          path: package/SpinUI-Manual.zip
          if-no-files-found: error

      - name: Upload standalone executable and checksums
        uses: actions/upload-artifact@v4
        with:
          name: SpinUI-Windows-tools
          path: |
            dist/Loremaster.exe
            package/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish workflow-dispatch release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ inputs.release_tag }}'.Trim()
          if (-not $tag) { throw 'release_tag cannot be empty' }
          $assets = @(
            'package/SpinUI-Manual.zip',
            'package/SHA256SUMS.txt',
            'dist/Loremaster.exe'
          )
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "SpinUI $tag — Vellum & Ember" `
              --notes "Complete SpinUI Windows release. Extract SpinUI-Manual.zip for the UI, layout profiles, manual guide, and Loremaster. Verify downloads against SHA256SUMS.txt; the unsigned Loremaster executable can trip antivirus machine-learning heuristics (see the README's Troubleshooting section)."
          }

      - name: Attach package to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          package/SpinUI-Manual.zip
          package/SHA256SUMS.txt
          dist/Loremaster.exe
          --clobber
