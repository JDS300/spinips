name: Build SpinUI components and Windows release

on:
  push:
    branches: ["main", "agent/**", "claude/**", "codex/**"]
    paths:
      - "spinui_reloaded/**"
      - "spinui_glass/**"
      - "layouts/**"
      - "loremaster/**"
      - "loremaster-desktop/**"
      - "installer/**"
      - "tools/**"
      - "docs/**"
      - "UI_Spin_qeynos_LO1.ini"
      - "README.md"
      - ".github/workflows/build-loremaster.yml"
  # Branch names outside the push list above -- fix/**, and anything else --
  # used to reach main without a single check having run on them, so the first
  # signal arrived after the merge. Proposed changes are verified here instead.
  pull_request:
    branches: ["main"]
    paths:
      - "spinui_reloaded/**"
      - "spinui_glass/**"
      - "layouts/**"
      - "loremaster/**"
      - "loremaster-desktop/**"
      - "installer/**"
      - "tools/**"
      - "docs/**"
      - "UI_Spin_qeynos_LO1.ini"
      - "README.md"
      - ".github/workflows/build-loremaster.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish these builds on the GitHub Releases page"
        required: true
        default: true
        type: boolean
      release_tag:
        description: "Release tag to create or update"
        required: true
        default: "v1.0.0"
        type: string
      prerelease:
        description: "Publish as a release candidate (never offered to updaters)"
        required: true
        default: true
        type: boolean
  release:
    types: [created]

permissions:
  contents: write

concurrency:
  group: spinui-build-${{ github.workflow }}-${{ github.ref }}
  # A newer test push or PR revision supersedes an older one; release assembly
  # is never cancelled.
  cancel-in-progress: >-
    ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.scope.outputs.ui }}
      loremaster: ${{ steps.scope.outputs.loremaster }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify change classifier
        run: python tools/ci_change_scope.py --self-test

      - name: Classify changed paths
        id: scope
        shell: pwsh
        run: |
          $scopeArgs = @(
            '--head', '${{ github.sha }}',
            '--default-branch', '${{ github.event.repository.default_branch }}',
            '--github-output', $env:GITHUB_OUTPUT
          )
          if ('${{ github.event_name }}' -eq 'push') {
            $scopeArgs += @('--base', '${{ github.event.before }}')
          } else {
            # Manual and tagged releases always build both components fresh.
            $scopeArgs += '--force-all'
          }
          python tools/ci_change_scope.py @scopeArgs
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @"
          | Component | Build this run |
          | --- | --- |
          | SpinUI skins | $((Get-Content $env:GITHUB_OUTPUT | Select-String '^ui=').Line.Split('=')[1]) |
          | Loremaster | $((Get-Content $env:GITHUB_OUTPUT | Select-String '^loremaster=').Line.Split('=')[1]) |
          "@

  build-ui:
    name: Validate and package SpinUI skins
    needs: detect-changes
    # Asset/XML/Glass audits and the pwsh package assembly are platform
    # agnostic (pwsh ships on every GitHub-hosted runner, and Compress-Archive
    # / Copy-Item produce identical output on Linux); ubuntu-latest is
    # cheaper and faster than windows-latest for this job. detect-changes
    # already proves pwsh-on-ubuntu works in this same workflow.
    if: needs.detect-changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The layout drift check rebuilds from the immutable stock-layout
          # commit used by generate_spinui_layout.py.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install UI validation tooling
        run: python -m pip install --disable-pip-version-check pillow tzdata==2026.3

      - name: Fetch stock-layout reference commit
        shell: bash
        run: |
          # The generated-layout drift check replays
          # 0eac353:default_modern/*.ini, but that commit is unreachable from
          # every ref, so no clone fetches it at any depth -- fetch-depth: 0 is
          # necessary but not sufficient. GitHub still serves it by exact SHA.
          git fetch --no-tags origin 0eac353de160346146fc8bd451fc60eb7b7a371a

      - name: Verify update manifest builder
        run: python tools/build_spinui_update_manifest.py --self-test

      - name: Run release quality gate
        run: python tools/release_quality_gate.py

      - name: Assemble UI component package
        shell: pwsh
        run: |
          $uiPackage = Join-Path $PWD 'package/SpinUI-UI'
          New-Item -ItemType Directory -Force -Path $uiPackage | Out-Null
          Copy-Item -Recurse -Force spinui_reloaded (Join-Path $uiPackage 'spinui_reloaded')
          Copy-Item -Recurse -Force spinui_glass (Join-Path $uiPackage 'spinui_glass')
          # Public aliases plus every validated resolution profile ship;
          # layouts/original and layouts/spin-live stay internal.
          $packageLayouts = Join-Path $uiPackage 'layouts'
          New-Item -ItemType Directory -Force -Path $packageLayouts | Out-Null
          foreach ($preset in @('combat-focus', 'social-focus', 'hybrid')) {
            Copy-Item -Recurse -Force (Join-Path 'layouts' $preset) (Join-Path $packageLayouts $preset)
          }
          Copy-Item -Recurse -Force layouts/profiles (Join-Path $packageLayouts 'profiles')
          Copy-Item -Recurse -Force docs (Join-Path $uiPackage 'docs')
          Copy-Item -Force UI_Spin_qeynos_LO1.ini $uiPackage
          Copy-Item -Force README.md $uiPackage
          Copy-Item -Force installer/INSTALL-MANUAL.md (Join-Path $uiPackage 'INSTALL.md')
          Compress-Archive -Path "$uiPackage/*" -DestinationPath package/SpinUI-UI.zip -CompressionLevel Optimal

          $tag = '${{ github.event.release.tag_name || inputs.release_tag }}'.Trim()
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            $version = (Get-Content loremaster-desktop/package.json -Raw | ConvertFrom-Json).version
          }
          python tools/build_spinui_update_manifest.py `
            --archive package/SpinUI-UI.zip `
            --version $version `
            --output package/SpinUI-Update.json

      - name: Upload UI test package
        uses: actions/upload-artifact@v6
        with:
          name: SpinUI-UI
          path: |
            package/SpinUI-UI.zip
            package/SpinUI-Update.json
          if-no-files-found: error

  build-loremaster:
    name: Build portable Loremaster
    needs: detect-changes
    if: needs.detect-changes.outputs.loremaster == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v6
        with:
          version: "11.16.0"
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: loremaster-desktop/pnpm-lock.yaml

      - name: Install Loremaster build tooling
        run: python -m pip install --disable-pip-version-check pyinstaller==6.21.0 pillow tzdata==2026.3

      - name: Verify Loremaster desktop source
        working-directory: loremaster-desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm test:fixtures
          pnpm build
          pnpm test:gear
          pnpm test:items
          pnpm test:updates
          pnpm test:skin-updates

      - name: Fetch stock-layout reference commit
        shell: bash
        run: |
          # The generated-layout drift check replays
          # 0eac353:default_modern/*.ini, but that commit is unreachable from
          # every ref, so no clone fetches it at any depth -- fetch-depth: 0 is
          # necessary but not sufficient. GitHub still serves it by exact SHA.
          git fetch --no-tags origin 0eac353de160346146fc8bd451fc60eb7b7a371a

      - name: Run release quality gate
        run: python tools/release_quality_gate.py

      - name: Build headless Loremaster engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/spec | Out-Null
          # The engine keeps console-capable pipes for JSONL IPC. Electron
          # launches it hidden; users only see the React desktop window.
          pyinstaller --clean --noconfirm --onefile --console `
            --name LoremasterEngine --distpath dist --workpath build/loremaster-engine `
            --add-data "$((Resolve-Path 'loremaster/assets').Path);assets" `
            --collect-data tzdata `
            --specpath build/spec loremaster/desktop_worker.py

      - name: Smoke-test parser engine protocol
        run: python tools/smoke_loremaster_engine.py dist/LoremasterEngine.exe

      - name: Build portable Electron executable
        shell: pwsh
        working-directory: loremaster-desktop
        run: |
          $tag = '${{ github.event.release.tag_name || inputs.release_tag }}'.Trim()
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          pnpm exec electron-builder --win portable --x64 --publish never "-c.extraMetadata.version=$version"

      - name: Smoke-test Electron application
        shell: pwsh
        run: |
          $env:LOREMASTER_SMOKE_EXIT_MS = '2500'
          $lore = Start-Process -FilePath 'dist-electron-release/win-unpacked/Loremaster.exe' -PassThru -Wait -WindowStyle Hidden
          if ($lore.ExitCode -ne 0) { throw "Loremaster Electron smoke exit code $($lore.ExitCode)" }

      - name: Publish Loremaster component checksum
        shell: pwsh
        run: |
          $component = Join-Path $PWD 'package/Loremaster-Windows'
          New-Item -ItemType Directory -Force -Path $component | Out-Null
          Copy-Item -Force dist-electron-release/Loremaster.exe $component
          $file = Join-Path $component 'Loremaster.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          $checksum = Join-Path $component 'Loremaster-SHA256.txt'
          Set-Content -Path $checksum -Value "$hash  Loremaster.exe`n" -NoNewline
          Get-Content $checksum

      - name: Upload Loremaster test build
        uses: actions/upload-artifact@v6
        with:
          name: Loremaster-Windows
          path: package/Loremaster-Windows/*
          if-no-files-found: error

  build-loremaster-linux:
    name: Build portable Loremaster (Linux)
    needs: detect-changes
    if: needs.detect-changes.outputs.loremaster == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # release_quality_gate.py replays the generated-layout drift check
          # against an early immutable commit; it needs full history exactly
          # like the Windows build-loremaster job does.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v6
        with:
          version: "11.16.0"
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: loremaster-desktop/pnpm-lock.yaml

      - name: Install Loremaster validation tooling
        run: python3 -m pip install --disable-pip-version-check pillow tzdata==2026.3

      - name: Run Loremaster Python test suite
        shell: bash
        working-directory: loremaster/tests
        # The capture tests open a real X11 window, which is why they are
        # opt-in: on a developer desktop they appear over whatever the user is
        # doing. A CI runner has no one to interrupt, so run the full set.
        env:
          LOREMASTER_X11_WINDOW_TESTS: "1"
        run: python3 -m unittest discover -s . -p 'test_*.py'

      - name: Smoke-test parser engine protocol (source)
        shell: bash
        run: |
          # No PyInstaller binary is built on Linux (the engine ships as
          # stdlib-only Python sources run by the system python3, see
          # package.json's linux.extraResources). smoke_loremaster_engine.py
          # only knows how to launch an executable, so hand it a tiny shim
          # that execs the worker script through python3.
          shim="$RUNNER_TEMP/loremaster_engine_shim.sh"
          printf '%s\n' '#!/usr/bin/env bash' "exec python3 \"$GITHUB_WORKSPACE/loremaster/desktop_worker.py\" \"\$@\"" > "$shim"
          chmod +x "$shim"
          python3 tools/smoke_loremaster_engine.py "$shim"

      - name: Fetch stock-layout reference commit
        shell: bash
        run: |
          # The generated-layout drift check replays
          # 0eac353:default_modern/*.ini, but that commit is unreachable from
          # every ref, so no clone fetches it at any depth -- fetch-depth: 0 is
          # necessary but not sufficient. GitHub still serves it by exact SHA.
          git fetch --no-tags origin 0eac353de160346146fc8bd451fc60eb7b7a371a

      - name: Run release quality gate
        run: python3 tools/release_quality_gate.py

      - name: Verify Loremaster desktop source
        shell: bash
        working-directory: loremaster-desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm test:fixtures
          pnpm build
          pnpm test:gear

      - name: Verify installer selftest
        run: python3 installer/spinui_installer.py --selftest

      - name: Build Linux Electron artifacts
        shell: bash
        working-directory: loremaster-desktop
        # Mirrors the Windows job's version derivation so Linux artifacts carry
        # the real release tag instead of package.json's static version. Calls
        # electron-builder directly rather than `pnpm run dist:linux` because
        # the version override has to reach electron-builder, not the chained
        # `pnpm build` in front of it.
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if ! printf '%s' "$version" \
            | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            version="$(node -p "require('./package.json').version")"
          fi
          pnpm build
          pnpm exec electron-builder --linux AppImage tar.gz --x64 \
            --publish never "-c.extraMetadata.version=$version"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Publish Loremaster Linux component checksums
        shell: bash
        run: |
          set -euo pipefail
          component="$PWD/package/Loremaster-Linux"
          mkdir -p "$component"
          shopt -s nullglob
          appimages=(dist-electron-release/*.AppImage)
          tarballs=(dist-electron-release/*.tar.gz)
          if [ "${#appimages[@]}" -eq 0 ] || [ "${#tarballs[@]}" -eq 0 ]; then
            echo "expected at least one .AppImage and one .tar.gz in dist-electron-release/" >&2
            ls -la dist-electron-release/ >&2 || true
            exit 1
          fi
          cp -f "${appimages[@]}" "${tarballs[@]}" "$component/"
          (cd "$component" && sha256sum -- *.AppImage *.tar.gz > Loremaster-Linux-SHA256SUMS.txt)
          cat "$component/Loremaster-Linux-SHA256SUMS.txt"

      - name: Upload Loremaster Linux test build
        uses: actions/upload-artifact@v6
        with:
          name: Loremaster-Linux
          path: package/Loremaster-Linux/*
          if-no-files-found: error

  package-windows-release:
    name: Assemble complete Windows release
    needs: [detect-changes, build-ui, build-loremaster]
    # Named events rather than "not push": these jobs stage and publish a
    # release, so they belong to the two events that produce one. Pull
    # requests build and verify without assembling anything to publish.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package validation tooling
        run: python -m pip install --disable-pip-version-check pillow tzdata==2026.3

      - name: Download verified UI component
        uses: actions/download-artifact@v6
        with:
          name: SpinUI-UI
          path: package/ui-component

      - name: Download verified Loremaster component
        uses: actions/download-artifact@v6
        with:
          name: Loremaster-Windows
          path: package/loremaster-component

      - name: Assemble staged manual release
        shell: pwsh
        run: |
          $manualPackage = Join-Path $PWD 'package/SpinUI-Manual'
          New-Item -ItemType Directory -Force -Path $manualPackage | Out-Null
          Copy-Item -Force package/ui-component/SpinUI-UI.zip package/SpinUI-UI.zip
          Copy-Item -Force package/ui-component/SpinUI-Update.json package/SpinUI-Update.json
          Expand-Archive -LiteralPath package/SpinUI-UI.zip -DestinationPath $manualPackage -Force
          New-Item -ItemType Directory -Force -Path dist-electron-release | Out-Null
          Copy-Item -Force package/loremaster-component/Loremaster.exe dist-electron-release/Loremaster.exe
          Copy-Item -Force dist-electron-release/Loremaster.exe $manualPackage

      - name: Verify staged release package
        run: >
          python tools/release_quality_gate.py --packages-only
          --package manual=package/SpinUI-Manual

      - name: Compress verified release package
        shell: pwsh
        run: |
          $manualPackage = Join-Path $PWD 'package/SpinUI-Manual'
          Compress-Archive -Path "$manualPackage/*" -DestinationPath package/SpinUI-Manual.zip -CompressionLevel Optimal

      - name: Publish SHA-256 checksums
        shell: pwsh
        run: |
          # A published checksum list lets users confirm a download is the
          # exact CI-built file when an antivirus heuristic questions it.
          $lines = foreach ($file in @(
              'package/SpinUI-Manual.zip',
              'package/SpinUI-UI.zip',
              'package/SpinUI-Update.json',
              'dist-electron-release/Loremaster.exe')) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $file)"
          }
          Set-Content -Path package/SHA256SUMS.txt -Value ($lines -join "`n") -NoNewline
          Add-Content -Path package/SHA256SUMS.txt -Value "`n"
          Get-Content package/SHA256SUMS.txt

      - name: Upload complete manual package
        uses: actions/upload-artifact@v6
        with:
          name: SpinUI-Manual
          path: package/SpinUI-Manual.zip
          if-no-files-found: error

      - name: Upload complete Windows tools and checksums
        uses: actions/upload-artifact@v6
        with:
          name: SpinUI-Windows-tools
          path: |
            dist-electron-release/Loremaster.exe
            package/SpinUI-UI.zip
            package/SpinUI-Update.json
            package/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish workflow-dispatch release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ inputs.release_tag }}'.Trim()
          if (-not $tag) { throw 'release_tag cannot be empty' }
          $prerelease = [System.Convert]::ToBoolean('${{ inputs.prerelease }}')
          # Both updaters skip prereleases and compare semver prerelease
          # components, so the tag has to carry one. Publishing a candidate as
          # a bare vX.Y.Z would burn the tag the real release needs, and a full
          # release tagged -rc would be permanently invisible to updaters.
          $hasSuffix = $tag -match '^v?\d+\.\d+\.\d+-'
          if ($prerelease -and -not $hasSuffix) {
            throw "A release candidate needs a prerelease suffix, for example ${tag}-rc.1"
          }
          if (-not $prerelease -and $hasSuffix) {
            throw "$tag carries a prerelease suffix, so it cannot be published as a full release"
          }
          $assets = @(
            'package/SpinUI-Manual.zip',
            'package/SpinUI-UI.zip',
            'package/SpinUI-Update.json',
            'package/SHA256SUMS.txt',
            'dist-electron-release/Loremaster.exe'
          )
          $candidateNote = if ($prerelease) {
            "`n`nThis is a release candidate. Install it by hand to test it: the in-app updaters ignore prereleases, so nobody is offered this build."
          } else { "" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
            # Re-running a dispatch must not silently promote a candidate to a
            # full release, or demote a published one.
            if ($prerelease) {
              gh release edit $tag --repo $env:GITHUB_REPOSITORY --prerelease --latest=false
            } else {
              gh release edit $tag --repo $env:GITHUB_REPOSITORY --prerelease=false --latest
            }
          } else {
            $flags = if ($prerelease) { @('--prerelease') } else { @('--latest') }
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY @flags `
              --target $env:GITHUB_SHA `
              --title "SpinUI $tag — Vellum & Ember + Glass" `
              --notes "Complete SpinUI Windows release. Extract SpinUI-Manual.zip for both the classic spinui_reloaded skin and optional spinui_glass skin, layout profiles, manual guide, and the portable TypeScript/Electron Loremaster. Verify downloads against SHA256SUMS.txt; the unsigned Loremaster executable can trip antivirus machine-learning heuristics (see the README's Troubleshooting section).$candidateNote"
          }

      - name: Attach package to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          package/SpinUI-Manual.zip
          package/SpinUI-UI.zip
          package/SpinUI-Update.json
          package/SHA256SUMS.txt
          dist-electron-release/Loremaster.exe
          --clobber

  package-linux-release:
    name: Assemble complete Linux release
    # Linux artifacts are attached to the release standalone (mirroring how
    # Loremaster.exe is published as its own release asset) rather than
    # folded into SpinUI-Manual.zip, which is the Windows-specific manual
    # install bundle referenced by that package's own release notes text.
    # This job never touches package-windows-release's steps or outputs.
    #
    # needs: package-windows-release is a sequencing dependency, not a
    # component dependency: it guarantees that when a release is meant to be
    # published (workflow_dispatch with publish_release=true), the Windows
    # job's "Publish workflow-dispatch release" step has already run
    # gh release create for the tag before this job's gh release upload
    # runs, avoiding a create/upload race between two parallel jobs writing
    # to the same release. For the `release` event the release already
    # exists before the workflow starts, so this ordering is a no-op there.
    needs: [detect-changes, build-loremaster-linux, package-windows-release]
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
      && needs.detect-changes.outputs.loremaster == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Loremaster Linux component
        uses: actions/download-artifact@v6
        with:
          name: Loremaster-Linux
          path: package/loremaster-linux-component

      - name: Upload complete Linux tools and checksums
        uses: actions/upload-artifact@v6
        with:
          name: SpinUI-Linux-tools
          path: package/loremaster-linux-component/*
          if-no-files-found: error

      - name: Publish workflow-dispatch release (Linux assets)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo 'release_tag cannot be empty' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" package/loremaster-linux-component/* \
            --repo "${{ github.repository }}" --clobber

      - name: Attach Linux assets to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" package/loremaster-linux-component/* \
            --repo "${{ github.repository }}" --clobber
